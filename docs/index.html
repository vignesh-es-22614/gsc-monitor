<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Console Monitor</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f4f4f1;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --up:#006300; --down:#b42318;
  --fill-1:rgba(42,120,214,.13);
  --radius:10px;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --up:#0ca30c; --down:#e66767;
    --fill-1:rgba(57,135,229,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --up:#0ca30c; --down:#e66767;
  --fill-1:rgba(57,135,229,.16);
}

*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font:14px/1.5 var(--font)}
a{color:var(--s1)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------------------------------------------------------------- shell */
/* Wide by design: these tables are long URLs and long queries beside seven
   numeric columns, and horizontal room is what makes them readable. */
.wrap{max-width:min(2200px,97vw);margin:0 auto;padding-block:20px;
  padding-left:16px;padding-right:16px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.brand h1{font-size:19px}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--ink-2);font:500 12.5px var(--font);
  padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.07);font-weight:600}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:6px 10px;font:500 12.5px var(--font);cursor:pointer}
.iconbtn:hover{color:var(--ink)}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
/* min-width:0 on the tracks' contents: a `1fr` track is minmax(auto,1fr), so
   the sidebar's nowrap property names would otherwise set a min-content floor
   wider than a phone screen and push the whole page into horizontal scroll. */
.layout>*{min-width:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* ---------------------------------------------------------------- cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.card{min-width:0}
.card>h2{font-size:13px;padding:13px 15px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .note{font-weight:400;color:var(--muted);font-size:11.5px}
.card .body{padding:15px}

/* ------------------------------------------------------------- property */
.plist{max-height:none;overflow:auto}
.plist button{display:block;width:100%;min-width:0;text-align:left;border:0;background:none;
  cursor:pointer;padding:9px 14px;border-bottom:1px solid var(--border);font:inherit;color:inherit}
.plist button:last-child{border-bottom:0}
.plist button:hover{background:var(--surface-2)}
.plist button[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--s1)}
.plist .pname{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .pmeta{display:flex;gap:8px;align-items:baseline;margin-top:2px;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.rootbadge{font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);
  border:1px solid var(--border);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}

/* ----------------------------------------------------------- stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}
.tile .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:25px;font-weight:600;margin-top:5px;letter-spacing:-.02em}
.tile .d{font-size:12px;margin-top:3px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* --------------------------------------------------------------- charts */
.chartgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:16px}
figure{margin:0}
figcaption{font-size:12.5px;font-weight:600;padding:12px 15px 0;display:flex;
  justify-content:space-between;align-items:baseline;gap:10px}
figcaption .hint{font-weight:400;color:var(--muted);font-size:11.5px}
.plot{position:relative;padding:6px 8px 4px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);
  border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:12px;
  box-shadow:0 4px 14px rgba(0,0,0,.14);white-space:nowrap;opacity:0;transition:opacity .08s;z-index:5;
  font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 15px 11px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block}

/* --------------------------------------------------------------- tables */
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:none;color:var(--muted);font:600 13px var(--font);
  padding:8px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.045em;color:var(--muted);
  font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface);z-index:1}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th[aria-sort]:after{content:"";margin-left:4px}
th[aria-sort="descending"]:after{content:"â–¾"}
th[aria-sort="ascending"]:after{content:"â–´"}
tbody tr:hover{background:var(--surface-2)}
td.ent{max-width:min(900px,48vw);overflow:hidden;text-overflow:ellipsis}
td.ent .sub{color:var(--muted);font-size:11px}
tr.clickable{cursor:pointer}
.delta{font-variant-numeric:tabular-nums;font-size:12px}
.bar{height:3px;border-radius:2px;background:var(--s1);display:block;margin-top:3px;min-width:1px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
input[type=search],input[type=number],.filters select{background:var(--surface-2);
  border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:7px 11px;
  font:13px var(--font)}
input[type=search]{flex:1;min-width:170px}
.filters select{cursor:pointer}
input::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--s1);outline-offset:1px}

/* --------------------------------------------------------------- alerts */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px;padding:11px 15px;
  border-bottom:1px solid var(--border);align-items:start}
.alert:last-child{border-bottom:0}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;white-space:nowrap;padding-top:2px}
.sev.critical{color:var(--critical)} .sev.warning{color:var(--serious)} .sev.info{color:var(--s1)}
.alert .ent{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.alert .msg{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.alert .prop{font-size:11px;color:var(--muted);margin-top:2px}

/* ------------------------------------------------------------- explore */
.exgrid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.exgrid label{display:flex;flex-direction:column;gap:4px;font-size:11px;
  text-transform:uppercase;letter-spacing:.045em;color:var(--muted);font-weight:600}
.exgrid input[type=date],.exgrid select,.exgrid input[type=search]{
  background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:7px 10px;font:13px var(--font);text-transform:none;
  letter-spacing:0;font-weight:400}
.exgrid .pair{display:flex;gap:6px}
.exgrid .pair input[type=search]{min-width:210px}
.iconbtn.primary{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
.facet{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;
  padding-top:11px;border-top:1px solid var(--border)}
.facet b{font-size:11px;text-transform:uppercase;letter-spacing:.045em;
  color:var(--muted);margin-right:4px;min-width:58px}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);
  border-radius:999px;padding:4px 10px;font:12px var(--font);cursor:pointer;
  display:inline-flex;gap:6px;align-items:baseline}
.chip span{color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--s1);border-color:var(--s1);color:#fff}
.chip.on span{color:rgba(255,255,255,.75)}
.iconbtn.sm{padding:4px 9px;font-size:11.5px}
.exgrid .pair #q_presets{display:flex;gap:4px}

.empty{padding:26px 15px;color:var(--muted);font-size:13px;text-align:center}
.banner{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px;display:flex;gap:9px}
.banner b{color:var(--ink);font-weight:600}
.caveat{font-size:11.5px;color:var(--muted);padding:10px 15px 0;line-height:1.5}
footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--border);
  color:var(--muted);font-size:11.5px;line-height:1.6}
.hidden{display:none!important}
.spinner{padding:40px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <h1>Search Console Monitor</h1>
    <div class="sub" id="subtitle">Loadingâ€¦</div>
  </div>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Comparison window" id="winseg"></div>
    <button class="iconbtn" id="themebtn" title="Toggle theme">â— Theme</button>
  </div>
</header>

<div id="alertbanner"></div>

<div class="layout">

  <!-- ------------------------------------------------ property selector -->
  <aside>
    <div class="card">
      <h2>Properties <span class="note" id="propcount"></span></h2>
      <div class="plist" id="plist"></div>
    </div>
    <p class="caveat" style="padding-left:2px">
      <b>manageengine.com</b> is a URL-prefix property that contains the product
      properties listed under it. Their figures overlap â€” never add properties together.
    </p>
  </aside>

  <!-- ------------------------------------------------------ main region -->
  <main id="main">
    <div class="spinner">Loading dataâ€¦</div>
  </main>
</div>

<footer>
  <div id="foot"></div>
</footer>
</div>

<script>
// ============================================================== state ===
const S = {
  summary:null, prop:null, propData:null, win:28, tab:'pages',
  smooth:true, sort:{key:'c',dir:-1}, openPage:null, range:180, shown:300,
  // One filter set per tab, so switching tabs does not silently carry a
  // page pattern over onto queries.
  filters:{
    pages:{op:'contains', terms:'', join:'any', min:''},
    queries:{op:'contains', terms:'', join:'any', min:''},
  },
};

// "contains" / "does not contain" over a comma-separated term list, matched
// with ANY or ALL. Terms are trimmed and case-folded; empty ones are dropped
// so a trailing comma does not match everything.
function applyFilter(rows, f){
  const terms = f.terms.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean);
  let out = rows;
  if(terms.length){
    const hit = k => f.join==='all' ? terms.every(t=>k.includes(t))
                                    : terms.some(t=>k.includes(t));
    out = out.filter(r=>{
      const k = String(r.k).toLowerCase();
      return f.op==='contains' ? hit(k) : !hit(k);
    });
  }
  const min = parseInt(f.min, 10);
  if(!isNaN(min)) out = out.filter(r=>r.c >= min);
  return out;
}
const $ = s => document.querySelector(s);
const fmt = n => n==null ? 'â€“' : n.toLocaleString('en-US');
const fmt1 = n => n==null ? 'â€“' : n.toFixed(1);
const pctOf = (a,b) => (!b) ? null : (a-b)/b*100;

function deltaHTML(cur, prev, opts={}){
  const d = pctOf(cur, prev);
  if(d===null) return '<span style="color:var(--muted)">new</span>';
  // Position is the one metric where a rising number is bad.
  const good = opts.lowerIsBetter ? d < 0 : d > 0;
  const cls = Math.abs(d) < 0.05 ? '' : (good ? 'up' : 'down');
  const arrow = Math.abs(d) < 0.05 ? '' : (d>0 ? 'â†‘' : 'â†“');
  return `<span class="delta ${cls}">${arrow}${Math.abs(d).toFixed(1)}%</span>`;
}
// Position is the one metric where the number and the outcome move opposite
// ways: 11.0 -> 12.3 is a bigger number and a worse ranking. An arrow is
// ambiguous here whichever way it points, so show the signed change instead
// and let colour carry good/bad.
function posDelta(cur, prev, verbose){
  if(cur==null||prev==null) return '<span style="color:var(--muted)">â€“</span>';
  const d = cur - prev;                       // positive = ranking worse
  if(Math.abs(d) < 0.05) return '<span class="delta">0.0</span>';
  const word = verbose ? (d<0 ? ' better' : ' worse') : '';
  return `<span class="delta ${d<0?'up':'down'}">${d>0?'+':'âˆ’'}${Math.abs(d).toFixed(1)}${word}</span>`;
}
const esc = s => String(s??'').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ============================================================== charts ===
// Hand-rolled SVG. One measure per plot, never two y-scales on one chart.
function lineChart(el, series, opts={}){
  const W=760, H=opts.height||190, P={t:10,r:14,b:24,l:50};
  if(!series.length || !series[0].pts.length){
    el.innerHTML = '<div class="empty">No data in this range.</div>'; return;
  }
  const all = series.flatMap(s=>s.pts);
  const xs = series[0].pts.map(p=>p[0]);
  let lo = Math.min(...all.map(p=>p[1])), hi = Math.max(...all.map(p=>p[1]));
  if(opts.zeroBase) lo = 0;
  if(hi===lo){ hi = lo + 1; }
  const pad = (hi-lo)*0.08; hi+=pad; if(!opts.zeroBase) lo-=pad;
  const inv = !!opts.invert;                  // position: lower is better
  const X = i => P.l + (xs.length<2?0:i*(W-P.l-P.r)/(xs.length-1));
  const Y = v => { const t=(v-lo)/(hi-lo); return P.t + (inv? t : 1-t)*(H-P.t-P.b); };

  const ticks=[]; const n=4;
  for(let i=0;i<=n;i++) ticks.push(lo + (hi-lo)*i/n);

  let g = ticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
      stroke="var(--grid)" stroke-width="1"/>
    <text x="${P.l-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10"
      fill="var(--muted)" font-variant-numeric="tabular-nums">${opts.fmtY? opts.fmtY(v): fmt(Math.round(v))}</text>`).join('');

  const step = Math.max(1, Math.ceil(xs.length/6));
  for(let i=0;i<xs.length;i+=step){
    g += `<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10"
      fill="var(--muted)">${xs[i].slice(2,7)}</text>`;
  }

  let paths='';
  series.forEach(s=>{
    const d = s.pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    if(s.fill){
      paths += `<path d="${d}L${X(s.pts.length-1).toFixed(1)},${Y(inv?hi:lo).toFixed(1)}L${X(0).toFixed(1)},${Y(inv?hi:lo).toFixed(1)}Z"
        fill="${s.fill}" stroke="none"/>`;
    }
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  });

  el.innerHTML = `<div class="plot">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'')}">
      ${g}
      <line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="var(--axis)" stroke-width="1"/>
      ${paths}
      <g id="cross" style="display:none">
        <line y1="${P.t}" y2="${H-P.b}" stroke="var(--axis)" stroke-width="1"/>
        ${series.map(s=>`<circle r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('')}
      </g>
      <rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent" id="hit"/>
    </svg>
    <div class="tip"></div>
  </div>`;

  const svg=el.querySelector('svg'), cross=el.querySelector('#cross'),
        tip=el.querySelector('.tip'), hit=el.querySelector('#hit');
  const circles=[...cross.querySelectorAll('circle')], vline=cross.querySelector('line');
  hit.addEventListener('pointermove', ev=>{
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((px-P.l)/((W-P.l-P.r)/Math.max(1,xs.length-1)));
    i=Math.max(0,Math.min(xs.length-1,i));
    cross.style.display='';
    vline.setAttribute('x1',X(i)); vline.setAttribute('x2',X(i));
    series.forEach((s,k)=>{ circles[k].setAttribute('cx',X(i)); circles[k].setAttribute('cy',Y(s.pts[i][1])); });
    tip.style.opacity=1;
    tip.innerHTML = `<b>${xs[i]}</b>` + series.map(s=>
      `<div style="margin-top:3px"><span class="swatch" style="background:${s.color}"></span>
       ${esc(s.name)} <b>${opts.fmtTip? opts.fmtTip(s.pts[i][1]) : fmt(Math.round(s.pts[i][1]))}</b></div>`).join('');
    const left = (X(i)/W)*r.width;
    tip.style.left = Math.min(Math.max(8,left+12), r.width-tip.offsetWidth-8)+'px';
    tip.style.top = '8px';
  });
  hit.addEventListener('pointerleave', ()=>{ cross.style.display='none'; tip.style.opacity=0; });
}

function barChart(el, rows, opts={}){
  if(!rows.length){ el.innerHTML='<div class="empty">No data.</div>'; return; }
  const max = Math.max(...rows.map(r=>r.v)) || 1;
  el.innerHTML = `<div style="padding:4px 15px 14px">` + rows.map(r=>`
    <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin:7px 0">
      <div style="min-width:0">
        <div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.k)}</div>
        <div style="height:7px;border-radius:3px;background:var(--s1);margin-top:4px;
          width:${Math.max(0.6,r.v/max*100)}%"></div>
      </div>
      <div style="font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)">${fmt(r.v)}</div>
    </div>`).join('') + `</div>`;
}

// Load health is a status readout, not a magnitude: on a healthy day every
// value is 0, and a bar chart of zeros shows nothing. Status colour plus an
// icon and a word, never colour alone.
function healthList(el){
  const rows = S.summary.properties.slice().sort((a,b)=>
    (b.days_behind - a.days_behind) || (b.missing_days - a.missing_days));
  el.innerHTML = `<div style="padding:2px 15px 14px">` + rows.map(p=>{
    const stale = p.days_behind > 2, gaps = p.missing_days > 0;
    const sev = stale ? 'critical' : gaps ? 'serious' : 'good';
    const icon = stale ? 'â–²' : gaps ? 'â—†' : 'â—';
    const word = stale ? `${p.days_behind}d behind`
               : gaps  ? `${p.missing_days} day${p.missing_days>1?'s':''} missing`
               : 'current';
    return `<div style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;
        gap:9px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border)">
      <span style="color:var(--${sev});font-size:11px">${icon}</span>
      <span style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
        title="${esc(p.site_url)}">${esc(p.label)}</span>
      <span style="font-size:11.5px;color:var(--${sev==='good'?'muted':sev});

// --------------------------------------------------------------- download ---
function csvCell(v){
  if(v==null) return '';
  const s = String(v);
  // A leading =, +, - or @ makes Excel treat the cell as a formula. Search
  // queries legitimately start with those, so prefix a quote to neutralise it.
  const safe = /^[=+\-@]/.test(s) ? "'" + s : s;
  return /[",\n\r]/.test(safe) ? '"' + safe.replace(/"/g,'""') + '"' : safe;
}
// 7-day mean. Search Console traffic is strongly weekly; a raw daily line is
// mostly weekday shape, which buries the trend the page exists to show.
function smooth(pts, k=7){
  if(pts.length < k) return pts;
  const out=[];
  for(let i=0;i<pts.length;i++){
    const a=Math.max(0,i-k+1); let s=0,n=0;
    for(let j=a;j<=i;j++){ if(pts[j][1]!=null){ s+=pts[j][1]; n++; } }
    out.push([pts[i][0], n? s/n : null]);
  }
  return out;
}

// ========================================================== data tabs ===
// Every tab runs the same query with a different GROUP BY, against DuckDB
// over the Parquet files. That is what lets all four filters work on all four
// tabs: the numbers are computed per question, not looked up in a precomputed
// table that only ever had one dimension in it.
const DIM_TABS = {
  pages:   {dim:'page',    title:'Pages',     drill:'query'},
  queries: {dim:'query',   title:'Queries',   drill:'page'},
  country: {dim:'country', title:'Countries', drill:null},
  device:  {dim:'device',  title:'Devices',   drill:null},
};

let SQLMOD = null;
const Q = {
  ready:false, status:'', err:null, busy:false, res:null, ran:null,
  f:{ from:'', to:'', page:'', pageOp:'contains', query:'', queryOp:'contains',
      join:'any', countries:[], devices:[] },
  minClicks:'', limit:0, open:null, drill:null,
  opts:{countries:[], devices:[]}, countrySearch:'', showAllCountries:false,
};

function qDefaults(){
  if(Q.f.to) return;
  const to = S.summary.latest_date;
  const d = new Date(to+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-27);
  Q.f.to = to; Q.f.from = d.toISOString().slice(0,10);
}

async function qBoot(){
  if(Q.ready) return;
  // Version the module URL with the build timestamp. A plain import('./sql.js')
  // is served from the HTTP cache, so a deploy that changes the query layer
  // would keep running the previous one against the new page -- which fails in
  // confusing ways rather than loudly.
  SQLMOD = SQLMOD || await import(
    './sql.js?v=' + encodeURIComponent(S.summary.generated_at || Date.now()));
  await SQLMOD.boot(s=>{ Q.status=s; const n=$('#q_status'); if(n) n.textContent=s; });
  Q.ready = true;
}

function qKey(){
  return JSON.stringify([S.prop, S.tab, Q.f, Q.minClicks, Q.limit]);
}

async function qRun(force){
  if(Q.busy) return;
  const key = qKey();
  if(!force && Q.ran === key) return;      // already showing this answer
  Q.busy = true; Q.err = null; Q.open = null; Q.drill = null;
  repaintTab();
  try{
    await qBoot();
    const dim = DIM_TABS[S.tab].dim, f = Q.f;
    const [tot, g, series] = await Promise.all([
      SQLMOD.totals(S.prop, f, [dim]),
      SQLMOD.group(S.prop, f, [dim], Q.limit || null, Q.minClicks),
      SQLMOD.daily(S.prop, f, [dim]),
    ]);
    if(!Q.opts.countries.length){
      Q.opts.countries = await SQLMOD.distinct(S.prop, f, 'country');
      Q.opts.devices   = await SQLMOD.distinct(S.prop, f, 'device');
    }
    Q.res = {tot, rows:g.rows, grain:g.grain, exact:g.exact, series,
             bytes: SQLMOD.bytesFor(g.grain, S.prop, f.from, f.to)};
    Q.ran = key;
  }catch(e){ Q.err = e.message || String(e); Q.res = null; }
  finally{ Q.busy = false; repaintTab(); }
}

/** Guard: a malformed result should show an error, not a stuck spinner. */
function resOk(r){
  return r && Array.isArray(r.rows) && Array.isArray(r.series);
}

function repaintTab(){
  const tb = $('#tabbody');
  if(tb && DIM_TABS[S.tab]) renderDataTab(tb);
  else if(tb && S.tab==='reports') renderReports(tb);
}

function qReset(){
  Q.f.page=''; Q.f.query=''; Q.f.countries=[]; Q.f.devices=[];
  Q.minClicks=''; Q.countrySearch='';
}
function qActive(){
  const f=Q.f;
  return !!(f.page||f.query||f.countries.length||f.devices.length||Q.minClicks);
}

function wireFilterBar(tb){
  const f = Q.f;
  const on = (id, fn, ev='onchange') => { const el=tb.querySelector('#'+id); if(el) el[ev]=fn; };
  // Text and date inputs update state but do NOT re-query on every keystroke --
  // each query reads parquet, so it waits for Apply or Enter.
  const text = (id, prop) => {
    const el = tb.querySelector('#'+id); if(!el) return;
    el.oninput = () => { f[prop] = el.value; };
    el.onkeydown = e => { if(e.key==='Enter') qRun(true); };
  };
  text('q_page','page'); text('q_query','query');
  on('q_from', e=>{ f.from = e.target.value; });
  on('q_to',   e=>{ f.to   = e.target.value; });
  on('q_pageop',  e=>{ f.pageOp  = e.target.value; });
  on('q_queryop', e=>{ f.queryOp = e.target.value; });
  on('q_join',    e=>{ f.join    = e.target.value; });
  on('q_limit',   e=>{ Q.limit = +e.target.value; });
  const mc = tb.querySelector('#q_min');
  if(mc){ mc.oninput = ()=>{ Q.minClicks = mc.value; };
          mc.onkeydown = e=>{ if(e.key==='Enter') qRun(true); }; }
  on('q_run', ()=>qRun(true), 'onclick');
  on('q_reset', ()=>{ qReset(); qRun(true); }, 'onclick');
  on('q_morec', ()=>{ Q.showAllCountries = true; repaintTab(); }, 'onclick');

  const cse = tb.querySelector('#q_csearch');
  if(cse) cse.oninput = () => {
    const pos = cse.selectionStart;
    Q.countrySearch = cse.value; Q.showAllCountries = false;
    repaintTab();
    const n = $('#q_csearch'); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  };

  const ps = tb.querySelector('#q_presets');
  if(ps) ps.onclick = ev => {
    const b = ev.target.closest('button[data-preset]'); if(!b) return;
    const to = S.summary.latest_date;
    const d = new Date(to+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-(+b.dataset.preset-1));
    f.to = to; f.from = d.toISOString().slice(0,10);
    qRun(true);
  };

  // Clicking a facet chip re-queries immediately: it is a single click with an
  // unambiguous meaning, unlike a half-typed search term.
  tb.querySelectorAll('.chip[data-dim]').forEach(c=>c.onclick=()=>{
    const arr = f[c.dataset.dim], v = c.dataset.val, i = arr.indexOf(v);
    if(i<0) arr.push(v); else arr.splice(i,1);
    qRun(true);
  });
}

function renderDataTab(tb){
  if(!tb) return;
  qDefaults();
  const cfg = DIM_TABS[S.tab], r = Q.res;
  const label = k => cfg.dim==='page'
    ? (String(k).replace(S.propData.site_url,'') || '/') : k;

  // Which body gets rendered decides what elements exist afterwards. The old
  // result stays in Q.res while a new query runs, so "have a result" is not
  // the same question as "am I showing it".
  const showResults = !Q.err && !Q.busy && resOk(r);
  let body;
  if(Q.err){
    body = `<div class="card"><div class="empty">
      <b style="color:var(--critical)">Query failed.</b><br>${esc(Q.err)}<br>
      <span style="font-size:12px">If this says manifest.json, the Parquet export
      has not run yet — run the workflow without <code>skip_parquet</code>.</span>
      </div></div>`;
  }else if(Q.busy){
    body = `<div class="card"><div class="spinner" id="q_status">${esc(Q.status||'Querying…')}</div></div>`;

    body = `<div class="card"><div class="empty">
      Set your filters and press <b>Apply</b>.<br>
      <span style="font-size:12px">The first query downloads the engine (~3 MB)

        <div class="v">${fmt1(r.tot?.position)}</div><div class="d">lower is better</div></div>
      <div class="tile"><div class="k">${esc(cfg.title)}</div><div class="v">${fmt(r.rows.length)}</div>
        <div class="d">read ${(r.bytes/1e6).toFixed(1)} MB</div></div>
    </div>
    <div class="card" style="margin-bottom:14px"><figure>
      <figcaption>Clicks per day <span class="hint">with these filters</span></figcaption>
      <div id="q_chart"></div></figure></div>
    <div class="card">
      <h2>${esc(cfg.title)} <span class="note">${fmt(r.rows.length)} rows${
        Q.limit && r.rows.length>=Q.limit?' — row limit reached':''}</span>
        <span style="margin-left:auto"><button class="iconbtn" id="q_dl">↓ CSV · ${fmt(r.rows.length)} rows</button></span></h2>
      <div class="tablewrap"><table><thead><tr>
        <th>${esc(cfg.dim)}</th><th class="num">Clicks</th><th class="num">Impressions</th>
        <th class="num">CTR</th><th class="num">Avg pos</th></tr></thead><tbody>` +
      r.rows.slice(0,S.shown).map(x=>{
        const open = Q.open===x.k;
        let tr = `<tr class="${cfg.drill?'clickable':''}" data-k="${esc(x.k)}">
          <td class="ent" title="${esc(x.k)}">${esc(label(x.k))}
            ${cfg.drill?`<span style="color:var(--muted)">${open?'▾':'▸'}</span>`:''}
            <span class="bar" style="width:${(x.clicks/max*100).toFixed(1)}%"></span></td>
          <td class="num">${fmt(x.clicks)}</td><td class="num">${fmt(x.impressions)}</td>
          <td class="num">${x.ctr!=null?(x.ctr*100).toFixed(2)+'%':'–'}</td>
          <td class="num">${fmt1(x.position)}</td></tr>`;
        if(open){
          const d = Q.drill;
          tr += `<tr><td colspan="5" style="background:var(--surface-2);padding:0">
            <div style="padding:9px 14px">
              <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;
                color:var(--muted);margin-bottom:6px">Top 10 ${esc(cfg.drill)}s ·
                same filters and date range</div>` +
            (!d ? '<div style="font-size:12px;color:var(--muted)">Loading…</div>'
             : !d.length ? '<div style="font-size:12px;color:var(--muted)">No rows.</div>'
             : `<table style="font-size:12px"><tbody>` + d.map(y=>
                 `<tr><td class="ent" title="${esc(y.k)}">${esc(cfg.drill==='page'
                    ? (String(y.k).replace(S.propData.site_url,'')||'/') : y.k)}</td>
                  <td class="num">${fmt(y.clicks)} clicks</td>
                  <td class="num">${fmt(y.impressions)} impr</td>
                  <td class="num">${y.ctr!=null?(y.ctr*100).toFixed(2)+'%':'–'}</td>
                  <td class="num">pos ${fmt1(y.position)}</td></tr>`).join('')
               + `</tbody></table>`) + `</div></td></tr>`;
        }
        return tr;
      }).join('') + `</tbody></table></div>` +
      (r.rows.length > S.shown
        ? `<div style="padding:12px;text-align:center"><button class="iconbtn" id="q_more">
             Show 1,000 more <span style="color:var(--muted)">· ${fmt(S.shown)} of ${fmt(r.rows.length)}</span></button></div>`
        : `<div style="padding:11px;text-align:center;color:var(--muted);font-size:12px">
             All ${fmt(r.rows.length)} rows shown</div>`) +
      (r.exact ? '' : `<p class="caveat">These figures come from the query grain,
        which Search Console strips of anonymised queries — they rank correctly
        but sum below the truth. Clear the query, country and device filters to
        get exact page-grain totals.</p>`) +
      `<div style="height:12px"></div></div>`;
  }

  tb.innerHTML = filterBar() + body;
  wireFilterBar(tb);

  const dl = tb.querySelector('#q_dl'); if(dl) dl.onclick = downloadRows;
  const more = tb.querySelector('#q_more');
  if(more) more.onclick = ()=>{ S.shown += 1000; repaintTab(); };
  tb.querySelectorAll('tr.clickable[data-k]').forEach(tr=>tr.onclick=async()=>{
    const k = tr.dataset.k;
    if(Q.open===k){ Q.open=null; Q.drill=null; repaintTab(); return; }
    Q.open=k; Q.drill=null; repaintTab();
    try{ Q.drill = await SQLMOD.drill(S.prop, Q.f, cfg.dim, k, cfg.drill, 10); }
    catch(e){ Q.drill = []; }
    if(Q.open===k) repaintTab();
  });

  const chartEl = tb.querySelector('#q_chart');
  if(showResults && chartEl && r.series.length){
    lineChart(chartEl, [{name:'Clicks', color:'var(--s1)',
      fill:'var(--fill-1)', pts:r.series.map(x=>[x.d, x.clicks])}],
      {zeroBase:true, label:'Clicks per day'});
  }

  // Auto-run on first arrival so the tab is never an empty prompt.
  if(!resOk(Q.res) && !Q.busy && !Q.err) qRun(false);
}

function downloadRows(rows, name){
  const list = Array.isArray(rows) ? rows : (Q.res?.rows || []);
  if(!list.length) return;
  const dims = Array.isArray(rows) ? (REP.dims) : [DIM_TABS[S.tab].dim];
  const head = [...dims,'clicks','impressions','ctr','position'];
  const body = list.map(r=>[...dims.map(d=>r[d]), r.clicks, r.impressions,
    r.ctr==null?'':r.ctr, r.position==null?'':r.position].map(csvCell).join(','));
  // Leading BOM, written as an escape rather than an invisible character, so
  // Excel opens UTF-8 queries as text instead of mojibake.
  const blob = new Blob(['﻿'+head.join(',')+'\n'+body.join('\n')],
    {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (name || `gsc_${S.propData.label.replace(/[^a-z0-9]+/gi,'-')}_${
    dims.join('-')}_${Q.f.from}_${Q.f.to}`) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },0);
}

// ============================================================= reports ===
// A saved report is just a filter set plus a grouping, so it produces the same
// numbers as the tabs -- it exists to answer a repeated question in one click
// and to cross dimensions the fixed tabs cannot, like page x country.
const REP = {
  dims:['query'], name:'', rows:null, busy:false, err:null,
  saved:[], editing:null, relative:28, useRelative:true, grain:null, exact:true,
};
const REP_KEY = 'gscm-reports';

function repLoad(){
  try{ REP.saved = JSON.parse(localStorage.getItem(REP_KEY) || '[]'); }
  catch(e){ REP.saved = []; }
}
function repPersist(){
  try{ localStorage.setItem(REP_KEY, JSON.stringify(REP.saved)); }catch(e){}
}

/** Relative ranges keep a saved report current instead of freezing its dates. */
function repRange(){
  if(!REP.useRelative) return {from:Q.f.from, to:Q.f.to};
  const to = S.summary.latest_date;
  const d = new Date(to+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-(REP.relative-1));
  return {from:d.toISOString().slice(0,10), to};
}

async function repRun(){
  REP.busy = true; REP.err = null; repaintTab();
  try{
    await qBoot();
    const rng = repRange();
    const f = {...Q.f, ...rng};
    const g = await SQLMOD.group(S.prop, f, REP.dims, Q.limit || null, Q.minClicks);
    REP.rows = g.rows; REP.grain = g.grain; REP.exact = g.exact;
  }catch(e){ REP.err = e.message || String(e); REP.rows = null; }
  finally{ REP.busy = false; repaintTab(); }
}

function repSave(){
  const name = (REP.name || '').trim();
  if(!name){ REP.err = 'Give the report a name first.'; repaintTab(); return; }
  const def = {
    name, dims:[...REP.dims], f:JSON.parse(JSON.stringify(Q.f)),
    minClicks:Q.minClicks, limit:Q.limit,
    useRelative:REP.useRelative, relative:REP.relative,
    site:S.prop, saved_at:new Date().toISOString().slice(0,10),
  };
  const i = REP.saved.findIndex(r=>r.name===name);
  if(i<0) REP.saved.push(def); else REP.saved[i] = def;
  repPersist(); repaintTab();
}

function repApply(def){
  REP.dims = [...def.dims]; REP.name = def.name;
  REP.useRelative = def.useRelative; REP.relative = def.relative;
  Object.assign(Q.f, JSON.parse(JSON.stringify(def.f)));
  Q.minClicks = def.minClicks; Q.limit = def.limit;
  const rng = repRange(); Q.f.from = rng.from; Q.f.to = rng.to;
  repRun();
}

function renderReports(tb){
  if(!tb) return;
  qDefaults();
  if(!REP.saved.length) repLoad();
  const rng = repRange();
  const DIMS = ['page','query','country','device'];

  const saved = REP.saved.length
    ? `<div class="tablewrap"><table><thead><tr>
        <th>Report</th><th>Group by</th><th>Range</th><th>Filters</th><th></th>
       </tr></thead><tbody>` +
      REP.saved.map((r,i)=>`<tr>
        <td class="ent"><b>${esc(r.name)}</b>
          <div class="sub">${esc(r.site||'')} · saved ${esc(r.saved_at||'')}</div></td>
        <td>${r.dims.map(d=>`<code>${esc(d)}</code>`).join(' × ')}</td>
        <td>${r.useRelative?`last ${r.relative}d`:`${esc(r.f.from)} → ${esc(r.f.to)}`}</td>
        <td style="font-size:11.5px;color:var(--ink-2)">${esc([
            r.f.page && `page ${r.f.pageOp==='not'?'∌':'∋'} ${r.f.page}`,
            r.f.query && `query ${r.f.queryOp==='not'?'∌':'∋'} ${r.f.query}`,
            r.f.countries?.length && `${r.f.countries.length} countries`,
            r.f.devices?.length && r.f.devices.join('/').toLowerCase(),
            r.minClicks && `≥${r.minClicks} clicks`,
          ].filter(Boolean).join(' · ') || 'none')}</td>
        <td class="num" style="white-space:nowrap">
          <button class="iconbtn sm" data-run="${i}">Run</button>
          <button class="iconbtn sm" data-del="${i}">Delete</button></td>
      </tr>`).join('') + `</tbody></table></div>`
    : `<div class="empty">No saved reports yet. Build one below and press
       <b>Save report</b> — it is stored in this browser.</div>`;

  const results = REP.err
    ? `<div class="card"><div class="empty"><b style="color:var(--critical)">Failed.</b><br>${esc(REP.err)}</div></div>`
    : REP.busy
    ? `<div class="card"><div class="spinner" id="q_status">${esc(Q.status||'Running report…')}</div></div>`
    : !REP.rows
    ? ''
    : `<div class="card"><h2>Result
        <span class="note">${fmt(REP.rows.length)} rows · grouped by
        ${REP.dims.join(' × ')}${REP.exact?'':' · query grain, understated'}</span>
        <span style="margin-left:auto"><button class="iconbtn" id="rep_dl">↓ CSV · ${fmt(REP.rows.length)} rows</button></span></h2>
      <div class="tablewrap"><table><thead><tr>
        ${REP.dims.map(d=>`<th>${esc(d)}</th>`).join('')}
        <th class="num">Clicks</th><th class="num">Impressions</th>
        <th class="num">CTR</th><th class="num">Avg pos</th></tr></thead><tbody>` +
      REP.rows.slice(0,500).map(x=>`<tr>
        ${REP.dims.map(d=>`<td class="ent" title="${esc(x[d])}">${esc(
          d==='page' ? (String(x[d]).replace(S.propData.site_url,'')||'/') : x[d])}</td>`).join('')}
        <td class="num">${fmt(x.clicks)}</td><td class="num">${fmt(x.impressions)}</td>
        <td class="num">${x.ctr!=null?(x.ctr*100).toFixed(2)+'%':'–'}</td>
        <td class="num">${fmt1(x.position)}</td></tr>`).join('') +
      `</tbody></table></div>${REP.rows.length>500
        ? `<div style="padding:11px;text-align:center;color:var(--muted);font-size:12px">
           500 of ${fmt(REP.rows.length)} shown · CSV has all of them</div>`:''}
      </div>`;

  tb.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <h2>Saved reports <span class="note">stored in this browser</span></h2>
      ${saved}
    </div>

    <div class="card" style="margin-bottom:14px">
      <h2>Build a report <span class="note">cross any dimensions — page × country,
        query × device — which the fixed tabs cannot do</span></h2>
      <div class="body">
        <div class="exgrid">
          <label>Name<input type="search" id="rep_name" value="${esc(REP.name)}"
            placeholder="e.g. India mobile KB pages" style="min-width:230px"></label>
          <label>Date range<select id="rep_rel">
            <option value="rel" ${REP.useRelative?'selected':''}>rolling</option>
            <option value="abs" ${!REP.useRelative?'selected':''}>fixed dates</option>
          </select></label>
          ${REP.useRelative
            ? `<label>Last<select id="rep_days">${[7,28,90,180,365].map(n=>
                `<option value="${n}" ${REP.relative===n?'selected':''}>${n} days</option>`).join('')}
               </select></label>`
            : `<label>Using<span style="font:400 13px var(--font);text-transform:none;
                 letter-spacing:0;color:var(--ink-2);padding:7px 0">${esc(rng.from)} → ${esc(rng.to)}
                 <span style="color:var(--muted)">(set above)</span></span></label>`}
          <label>&nbsp;<button class="iconbtn primary" id="rep_run">${REP.busy?'Running…':'Run report'}</button></label>
          <label>&nbsp;<button class="iconbtn" id="rep_save">Save report</button></label>
        </div>
        <div class="facet"><b>Group by</b>
          ${DIMS.map(d=>`<button class="chip${REP.dims.includes(d)?' on':''}"
            data-repdim="${d}">${d}</button>`).join('')}
          <span style="color:var(--muted);font-size:11.5px;margin-left:6px">
            pick one or more — order sets the columns</span>
        </div>
      </div>
    </div>

    ${filterBar()}
    ${results}`;

  wireFilterBar(tb);

  const nm = tb.querySelector('#rep_name');
  if(nm) nm.oninput = ()=>{ REP.name = nm.value; };
  const rl = tb.querySelector('#rep_rel');
  if(rl) rl.onchange = ()=>{ REP.useRelative = rl.value==='rel'; repaintTab(); };
  const rd = tb.querySelector('#rep_days');
  if(rd) rd.onchange = ()=>{ REP.relative = +rd.value; repaintTab(); };
  const rr = tb.querySelector('#rep_run'); if(rr) rr.onclick = repRun;
  const rs = tb.querySelector('#rep_save'); if(rs) rs.onclick = repSave;
  const rdl = tb.querySelector('#rep_dl');
  if(rdl) rdl.onclick = ()=>downloadRows(REP.rows,
    `gsc_report_${(REP.name||'untitled').replace(/[^a-z0-9]+/gi,'-')}_${rng.from}_${rng.to}`);

  tb.querySelectorAll('.chip[data-repdim]').forEach(c=>c.onclick=()=>{
    const d = c.dataset.repdim, i = REP.dims.indexOf(d);
    if(i<0) REP.dims.push(d); else if(REP.dims.length>1) REP.dims.splice(i,1);
    repaintTab();
  });
  tb.querySelectorAll('button[data-run]').forEach(b=>b.onclick=()=>
    repApply(REP.saved[+b.dataset.run]));
  tb.querySelectorAll('button[data-del]').forEach(b=>b.onclick=()=>{
    REP.saved.splice(+b.dataset.del,1); repPersist(); repaintTab(); });
}

function alertsView(scopeSite){
  const a = S.summary.alerts;
  if(!a) return `<div class="card"><div class="empty">Alerting has not run yet.</div></div>`;
  let list = a.alerts;
  if(scopeSite) list = list.filter(x=>x.site_url===scopeSite);
  if(!list.length) return `<div class="card"><h2>Alerts</h2>
    <div class="empty">Nothing breached a threshold${scopeSite?' for this property':''}
    over the last ${a.compare_days} days.</div></div>`;

  const icon = {critical:'â–²', warning:'â—†', info:'â—'};
  const groups = {pipeline:'Pipeline health', property:'Property level', page:'Pages', query:'Queries'};
  let out='';
  for(const [scope,title] of Object.entries(groups)){
    const items = list.filter(x=>x.scope===scope);
    if(!items.length) continue;
    out += `<div class="card" style="margin-bottom:12px"><h2>${title}
      <span class="note">${items.length}</span></h2>` +
      items.map(x=>{
        let ent = String(x.entity);
        if(x.scope==='page') ent = ent.replace(x.site_url,'') || '/';
        return `<div class="alert">
          <span class="sev ${x.severity}">${icon[x.severity]} ${x.severity.toUpperCase()}</span>
          <div><div class="ent">${esc(ent)}</div>
            <div class="msg">${esc(x.message)}</div>
            ${scopeSite?'':`<div class="prop">${esc(x.site_url)}</div>`}</div></div>`;
      }).join('') + `</div>`;
  }
  return `<div class="banner"><span>âš™</span><div>Thresholds live in
    <b>alerts.config.json</b> in the repo â€” there is no server to save settings to.
    Current window: last <b>${a.compare_days} days</b> vs the ${a.compare_days} before.</div></div>` + out;
}

// ================================================================ paint ===
function render(){
  const m=$('#main');
  // Repaint the sidebar too: aria-current lives there, so without this the
  // selected property never becomes the highlighted one.
  renderPropList();
  if(S.prop===null){
    m.innerHTML = overview();
    const w=String(S.win);
    const rows = S.summary.properties.filter(p=>!p.is_root)
      .map(p=>({k:p.label, v:(p.windows[w]||{}).clicks||0}))
      .sort((a,b)=>b.v-a.v);
    barChart($('#cmpbar'), rows);
    healthList($('#health'));
    m.querySelectorAll('tr[data-slug]').forEach(tr=>tr.onclick=()=>{
      S.prop=tr.dataset.slug; S.openPage=null; render();
    });
    if(S.tab==='alerts'){
      m.insertAdjacentHTML('afterbegin','<div id="ov_alerts"></div>');
      $('#ov_alerts').innerHTML = alertsView(null);
    }
    paintFooter(); return;
  }

  if(!S.propData || S.propData.slug!==S.prop){ loadProp(); return; }
  m.innerHTML = propView();

  // --- trend charts ------------------------------------------------------
  const daily = S.propData.daily.slice(S.range===9999? 0 : -S.range);
  const mk = (i, {invert=false, zeroBase=true, fmtY, fmtTip}={}) => {
    let pts = daily.map(r=>[r[0], r[i]]).filter(r=>r[1]!=null);
    if(S.smooth) pts = smooth(pts);
    return pts;
  };
  lineChart($('#c_clicks'), [{name:'Clicks', color:'var(--s1)', fill:'var(--fill-1)', pts:mk(1)}],
    {zeroBase:true, label:'Daily clicks'});
  lineChart($('#c_impr'), [{name:'Impressions', color:'var(--s1)', fill:'var(--fill-1)', pts:mk(2)}],
    {zeroBase:true, label:'Daily impressions'});
  lineChart($('#c_pos'), [{name:'Avg position', color:'var(--s1)', pts:mk(3)}],
    {invert:true, zeroBase:false, label:'Average position',
     fmtY:v=>v.toFixed(1), fmtTip:v=>v.toFixed(1)});

  $('#rangeseg').onclick = ev=>{ const b=ev.target.closest('button'); if(!b)return;
    S.range=+b.dataset.range; render(); };
  $('#smoothseg').onclick = ev=>{ const b=ev.target.closest('button'); if(!b)return;
    S.smooth = b.dataset.smooth==='1'; render(); };

  // --- tab body ----------------------------------------------------------
  const tb=$('#tabbody');
  if(DIM_TABS[S.tab])      renderDataTab(tb);
  else if(S.tab==='reports') renderReports(tb);
  else                       tb.innerHTML = alertsView(S.propData.site_url);

  $('#tabs').onclick = ev=>{ const b=ev.target.closest('button[data-tab]'); if(!b)return;
    S.tab=b.dataset.tab; S.shown=300; Q.open=null; Q.drill=null; render(); };

  paintFooter();
}

function paintFooter(){
  const s=S.summary;
  const live = (s.api_fallback_used||[]).length;
  $('#foot').innerHTML = (live ? `<b>${live} propert${live===1?'y is':'ies are'}</b>
    not in BigQuery yet and shown from a live Search Console API pull, marked
    <span class="rootbadge">LIVE API</span>. They carry only the rolling ~16-month
    window and no stored history until the backfill reaches them.<br>` : '') + `
    Page figures come from a page-grain Search Console pull and match the UI's Pages report exactly.
    Query, country and device figures come from a query-grain pull, which Search Console strips of
    anonymised queries â€” they rank correctly but under-count.<br>
    Page history starts ${s.properties.length? s.properties.map(p=>p.earliest_date).sort()[0] : 'â€“'};
    the API serves only a rolling ~16 months and nothing earlier can be recovered.
    Data through <b>${s.latest_date}</b>, built ${s.generated_at.replace('T',' ').replace('+00:00',' UTC')}.`;
}

// ================================================================= load ===
async function loadProp(){
  $('#main').innerHTML = '<div class="spinner">Loading propertyâ€¦</div>';
  try{
    const r = await fetch(`data/prop_${S.prop}.json`, {cache:'no-cache'});
    if(!r.ok) throw new Error(r.status);
    S.propData = await r.json();
    S.propData.slug = S.prop;
    render();
  }catch(e){
    $('#main').innerHTML = `<div class="card"><div class="empty">
      Could not load <code>data/prop_${esc(S.prop)}.json</code> (${esc(e.message)}).</div></div>`;
  }
}

function initTheme(){
  const saved = (()=>{ try{ return localStorage.getItem('gscm-theme'); }catch(e){ return null; } })();
  if(saved) document.documentElement.dataset.theme = saved;
  $('#themebtn').onclick = ()=>{
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
    const next = cur==='dark' ? 'light':'dark';
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem('gscm-theme', next); }catch(e){}
    render();
  };
}

(async function(){
  initTheme();
  try{
    const r = await fetch('data/summary.json', {cache:'no-cache'});
    S.summary = await r.json();
  }catch(e){
    $('#main').innerHTML = `<div class="card"><div class="empty">
      Could not load <code>data/summary.json</code>. Run <code>build_payload.py</code> first.</div></div>`;
    return;
  }
  S.win = S.summary.windows.includes(28) ? 28 : S.summary.windows[0];
  $('#winseg').innerHTML = S.summary.windows.map(w=>
    `<button data-win="${w}" aria-pressed="${w===S.win}">${w}d</button>`).join('');
  $('#winseg').onclick = ev=>{ const b=ev.target.closest('button'); if(!b)return;
    S.win=+b.dataset.win;
    $('#winseg').querySelectorAll('button').forEach(x=>
      x.setAttribute('aria-pressed', +x.dataset.win===S.win));
    S.shown = 300;   // each window has its own file and its own row count
    render();
  };
  $('#subtitle').textContent =
    `${S.summary.properties.length} properties · data through ${S.summary.latest_date}`;
  alertBanner();
  renderPropList();
  render();
})();
</script>
