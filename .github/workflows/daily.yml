name: Daily Search Console refresh

# 04:00 UTC = 09:30 IST. Search Console finalises on a ~3 day lag and the
# loader targets today-3, so an early run still picks up everything available.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Email the digest even if nothing breached a threshold'
        type: boolean
        default: false
      backfill_from:
        description: 'Re-pull from this date (YYYY-MM-DD). Leave blank to resume.'
        type: string
        default: ''
      skip_export:
        description: 'Skip the Search Console pull; rebuild the site from BigQuery only'
        type: boolean
        default: false
      skip_parquet:
        description: 'Skip the Explore-tab Parquet export (much faster first deploy)'
        type: boolean
        default: false

# pages + id-token are what deploy-pages needs; contents stays read-only
# because nothing is committed back any more.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gsc-daily
  cancel-in-progress: false

jobs:
  # The payload is ~126 MB of per-window entity files -- every page and every
  # query, uncapped. That is far too much to commit daily (roughly 45 GB of
  # repo churn a year), so the site is built here and published straight to
  # Pages as an artifact. Nothing is written back to the repository.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The Parquet files behind the Explore tab are ~300 MB and are NOT in the
      # repo. Without carrying them between runs every build would re-export a
      # full year, which is roughly 50 GB of BigQuery scan a day and would blow
      # through the 1 TB monthly free tier on its own. The cache lets the run
      # rewrite only the months Search Console actually revised.
      - name: Restore published data
        uses: actions/cache/restore@v4
        with:
          path: docs/data
          key: gsc-data-${{ github.run_id }}
          restore-keys: gsc-data-

      # The OAuth refresh token carries both webmasters.readonly and BigQuery
      # scopes. A service account would need adding as a user on all fourteen
      # Search Console properties, which is a per-property manual grant.
      - name: Restore credentials
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          if [ -z "$GSC_TOKEN_JSON" ]; then
            echo "::error::GSC_TOKEN_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$GSC_TOKEN_JSON" > gsc_token.json
          python -c "import json;d=json.load(open('gsc_token.json'));assert d.get('refresh_token'),'no refresh_token'"

      - name: Pull Search Console into BigQuery
        if: ${{ inputs.skip_export != true }}
        run: |
          if [ -n "${{ inputs.backfill_from }}" ]; then
            python gsc_export.py --all-sites --grain all --workers 6 \
              --start "${{ inputs.backfill_from }}"
          else
            python gsc_export.py --all-sites --grain all --workers 6
          fi

      # --api-fallback covers any property BigQuery has no rows for yet, so a
      # backfill still in flight never leaves a property missing from the site.
      - name: Build dashboard payload
        run: python build_payload.py --out docs/data --api-fallback

      # --refresh-days 10 rewrites only the month files the last ten days touch;
      # any month already present from the cache is reused untouched. A month
      # missing from the cache is rebuilt regardless, so a cold cache still
      # produces a complete set.
      - name: Export Parquet for the Explore tab
        if: ${{ inputs.skip_parquet != true }}
        run: |
          # --resume keeps whatever the cache restored, so a run that timed out
          # picks up where it stopped instead of re-scanning from scratch.
          python export_parquet.py --days 365 --refresh-days 10 --resume \
            --out docs/data/pq
          du -sh docs/data/pq

      - name: Detect anomalies and email the digest
        if: always()
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ "${{ inputs.send_email }}" = "true" ]; then
            python -c "
import json
p='alerts.config.json'
c=json.load(open(p)); c['email']['send_when_clean']=True
json.dump(c,open(p,'w'),indent=2)"
          fi
          python alerts.py --out docs/data \
            --url "${DASHBOARD_URL:-https://vignesh-es-22614.github.io/gsc-monitor/}"

      - name: Clean up credentials
        if: always()
        run: rm -f gsc_token.json

      - name: Report payload size
        run: |
          du -sh docs/data
          echo "entity files: $(ls docs/data/f | wc -l)"

      - name: Save published data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: docs/data
          key: gsc-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
